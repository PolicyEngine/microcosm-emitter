[project]
name = "microcosm-emitter"
version = "0.11.7"
description = "Local emitter process host with required build telemetry support"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "alembic>=1.13.3,<2",
    "sqlalchemy>=2,<3",
    "huggingface-hub>=0.20,<2",
    "psutil>=6,<8",
    "httpx>=0.27,<1",
    "microcosm-emitter-interface==0.11.7",
]

[project.urls]
Source = "https://github.com/PolicyEngine/microcosm-emitter"

[project.entry-points."microcosm.emitter.modules"]
telemetry = "microcosm_emitter.telemetry.service:create_module"
orrery = "microcosm_emitter.orrery.service:create_module"
huggingface = "microcosm_emitter.huggingface.service:create_module"

[project.scripts]
microcosm-emitter = "microcosm_emitter.cli:main"
microcosm-emitter-publish-graph = "microcosm_emitter.orrery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microcosm_emitter"]

# The rules tool, its registry and their documents are development tools of
# this repository; tools/check-installed.py refuses an archive holding them.
[tool.hatch.build.targets.sdist]
exclude = [
    "/scripts/rules",
    "/scripts/run_quality_guards.py",
    "/rules",
    "/docs/generated/rules.md",
    "/docs/engineering/skills/rules-registry.md",
]

# A lower bound, so an older uv refuses this project while Dependabot, which
# runs its own uv release, still can. CI installs the one release in
# .github/uv-version.txt (rule emitter.dependencies.uv-version-pinned).
[tool.uv]
required-version = ">=0.13"

[tool.uv.workspace]
members = ["packages/microcosm-emitter-interface"]

[tool.uv.sources]
microcosm-emitter-interface = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "build>=1,<2", "twine>=7,<8", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Shared test doubles, such as the in-memory Hugging Face Hub.
pythonpath = ["tests/support"]
addopts = "-q --import-mode=importlib"
markers = ["collector: requires the pinned collector and disposable PostgreSQL"]

[tool.ruff]
line-length = 88
target-version = "py313"
# Directories with no __init__.py on purpose (INP001); Ruff resolves modules as
# if each, and every directory below it, were a package. tools/ and scripts/
# hold scripts that run, never imported (scripts/rules is a package inside the
# implicit namespace package scripts), and the two Alembic directories hold the
# migration environments and revisions Alembic loads by path.
namespace-packages = [
    "scripts",
    "src/microcosm_emitter/core/alembic",
    "src/microcosm_emitter/core/handover_alembic",
    "tools",
]

[tool.ruff.lint]
# Every Ruff rule applies apart from the ignores below, as in the simulation
# API and the Public API (emitter.quality.ruff-lint).
select = ["ALL"]
ignore = [
    # These conflict with ruff format; Ruff's documentation says to disable
    # them when using the formatter.
    "COM812", "ISC001",
    # Mutually exclusive pydocstyle pairs: keep D211 (no blank line before a
    # class docstring) and D212 (summary on the first line).
    "D203", "D213",
    # Copyright notices: CPY001 is a stable rule from Ruff 0.16, but a preview
    # rule in the Ruff 0.15 the simulation API and the Public API run, so neither
    # enforces it; this repository leaves it off too.
    "CPY",
]

[tool.ruff.lint.per-file-ignores]
# File-level exceptions are allowed only for tests, tools/, scripts/ and
# modules that run as programs; the rules guard checks each pattern covers
# nothing else
# (docs/engineering/skills/rules-registry.md#file-level-exceptions).
# Tests may use pytest's bare assert, and need no docstrings, annotations or
# named constants for magic numbers. They may also reach into private members,
# live in directories that aren't packages, import inside a test (often after
# patching the environment), and use fake credentials, temporary paths, naive
# datetimes, SQL built from strings, prints and subprocess calls to the
# repository's scripts, may import the lazily loaded modules at module level,
# may name a fake's methods after the interface it replaces, and may leave a
# stand-in's arguments unused, as in the Public API and the simulation API.
# Every other rule applies to tests.
"**/tests/**" = [
    "ANN", "ARG001", "ARG002", "ARG005", "D1", "DTZ001", "DTZ011", "INP001",
    "N802", "PLC0415", "PLR2004", "S101", "S105", "S106", "S108", "S603",
    "S607", "S608", "SLF001", "T201", "TID253",
]
# The shared rules tool needs only the standard library, so its tests use
# unittest on purpose; pytest-style rules don't apply to them.
"scripts/rules/tests/**" = ["PT"]
# Command-line scripts print their output, run other programs and stamp
# today's date.
"scripts/**" = ["DTZ011", "S603", "S607", "T201"]
# The tools/ scripts CI runs have hyphenated file names, print their results
# and run other programs.
"tools/**" = ["N999", "S603", "T201"]
# The installed-artifact checks assert, as tests do, and import inside each
# check to test what that import loads.
"tools/{check-installed,installed-smoke,installed-interface-smoke}.py" = ["PLC0415", "S101"]
# The two smoke checks read the clients' private members to check the
# processes they started.
"tools/{installed-smoke,installed-interface-smoke}.py" = ["SLF001"]
# Modules that run as command-line programs print their output, as in the
# Public API.
"src/microcosm_emitter/{cli,host/__main__}.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["microcosm_emitter", "microcosm_emitter_interface"]

[tool.ruff.lint.flake8-tidy-imports]
# Modules imported only inside the function that needs them, never at module
# level (TID253 enforces it; TYPE_CHECKING imports are fine), as in the
# simulation API and the Public API. The telemetry and Hugging Face entry
# points (the service packages) import their module's implementation only when
# create_module runs, the Hub client's HfApi and CommitOperationAdd are
# imported only by the functions in huggingface/service/hub.py that build them,
# and the CLI imports the host's entry point only for `microcosm-emitter host`.
# Ruff's PLC0415 accepts in-function imports of these without a suppression. A
# module belongs here only if no application module imports it at module level.
banned-module-level-imports = [
    "huggingface_hub.CommitOperationAdd",
    "huggingface_hub.HfApi",
    "microcosm_emitter.host.__main__",
    "microcosm_emitter.huggingface.service.module",
    "microcosm_emitter.telemetry.service.module",
]

[tool.ruff.lint.flake8-type-checking]
# Classes whose annotations SQLAlchemy evaluates at runtime, when it configures
# the mappers, so their imports must stay at runtime. Ruff checks a class's
# bases through the imports of its own module and follows inheritance only
# through classes in that module, so the declarative bases' own base is listed;
# tests/test_runtime_evaluated_annotations.py checks every model
# (emitter.quality.runtime-evaluated-models-resolve).
runtime-evaluated-base-classes = ["sqlalchemy.orm.DeclarativeBase"]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
title_format = "## [{version}] - {project_date}"
issue_format = ""
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true
