[project]
name = "policyengine-local-services-workspace"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "build>=1,<2", "twine>=7,<8", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "-q --import-mode=importlib"
markers = ["collector: requires the pinned collector and disposable PostgreSQL"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
