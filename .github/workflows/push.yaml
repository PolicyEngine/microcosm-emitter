name: Push

on:
  push:
    branches: [main]

permissions:
  contents: read

# A merge with changelog fragments runs this workflow twice. On the merge
# commit, versioning commits the new version and changelog as "Update
# microcosm-emitter" with the PolicyEngine GitHub App token: unlike
# GITHUB_TOKEN, its push starts another run, and the app may bypass the main
# ruleset. On that release commit, the remaining jobs verify, tag, then
# publish, each only after the one before. A merge without fragments, such as
# Dependabot's lock-only update, runs it once: versioning commits nothing, so
# nothing is verified, tagged or published.
#
# PyPI trusts this file by name, in the pypi environment, which only main can
# use, for both distributions (microcosm-emitter and microcosm-emitter-interface).
# Renaming it stops publication.
jobs:
  versioning:
    name: Update versioning
    if: |
      github.repository == 'PolicyEngine/microcosm-emitter'
      && github.event.head_commit.message != 'Update microcosm-emitter'
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: .github/uv-version.txt
          python-version: "3.13"
          # A merge without changelog fragments runs no uv command, so no cache
          # directory exists for setup-uv to save
          # (rule emitter.ci.uv-cache-only-where-uv-runs).
          enable-cache: false
      - id: version
        run: bash tools/update-version.sh
      # A merge without changelog fragments, such as Dependabot's lock-only
      # update, releases nothing: no version commit, so the release jobs,
      # which run on that commit, never start.
      - if: steps.version.outputs.released == 'true'
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10
        with:
          add: "."
          author_name: Github Actions[bot]
          committer_name: Github Actions[bot]
          message: Update microcosm-emitter
          github_token: ${{ steps.app-token.outputs.token }}
          fetch: false

  verify:
    if: |
      github.repository == 'PolicyEngine/microcosm-emitter'
      && github.event.head_commit.message == 'Update microcosm-emitter'
    uses: ./.github/workflows/ci.yml

  tag:
    name: Publish git tag
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: bash tools/publish-git-tag.sh

  publish:
    needs: tag
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    # The emitter requires the interface of the same version, so the interface
    # is uploaded first: PyPI never offers an emitter whose interface is
    # missing. Files already on PyPI are skipped, so rerunning this job after
    # a failed or partial upload uploads only the missing files instead of
    # stopping on "File already exists".
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interface-distribution
          path: dist/interface
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/interface/
          skip-existing: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: emitter-distribution
          path: dist/emitter
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/emitter/
          skip-existing: true
