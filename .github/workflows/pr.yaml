name: Pull request

on:
  pull_request:

# A new push to a pull request supersedes the run on its previous head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # rhysd/actionlint 1.7.12, which also runs shellcheck on `run:` steps.
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  changelog:
    name: Check changelog fragment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The check compares a Dependabot pull request with its base branch.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: .github/uv-version.txt
          python-version: "3.13"
          # A Dependabot pull request that changes only uv.lock passes without
          # running uv, so no cache directory exists for setup-uv to save
          # (rule emitter.ci.uv-cache-only-where-uv-runs).
          enable-cache: false
      - env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/check-changelog.sh

  verify:
    uses: ./.github/workflows/ci.yml

  rules:
    name: Rules registry
    runs-on: ubuntu-latest
    # The guard looks up the tracking issue of each [rule.downgrade] with the
    # job's token.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The guard reads the base branch's registry to refuse a weaker rule.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: .github/uv-version.txt
          python-version: "3.13"
      # The ci-scripts tests run shellcheck; the tool needs nothing else.
      - run: uv tool install shellcheck-py==0.11.0.1
      - name: Test the rules tool
        run: uv run --no-project python -m unittest discover -s scripts/rules/tests -t .
      - name: Check the rules registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python scripts/run_quality_guards.py

  # The main ruleset requires this check by name.
  required:
    name: Required checks
    if: always()
    needs: [lint-workflows, changelog, verify, rules]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success success"
