[project]
name = "microcosm-provider-telemetry"
version = "0.1.0"
description = "Telemetry client and local telemetry emitter service module"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "microcosm-provider-client==0.1.0",
    "alembic>=1.13.3,<2",
    "sqlalchemy>=2,<3",
    "huggingface-hub>=0.20,<2",
    "psutil>=6,<8",
]

[project.urls]
Source = "https://github.com/PolicyEngine/microcosm-local-provider"

[project.entry-points."microcosm.provider.modules"]
telemetry = "microcosm_provider_telemetry.service:create_module"

[tool.uv.sources]
microcosm-provider-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microcosm_provider_telemetry"]
