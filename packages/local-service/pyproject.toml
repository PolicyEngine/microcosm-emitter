[project]
name = "policyengine-local-service"
version = "0.1.0"
description = "Private per-process local services with explicit module selection"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["psutil>=6,<8"]

[project.urls]
Source = "https://github.com/PolicyEngine/local-services"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policyengine_local_service"]
