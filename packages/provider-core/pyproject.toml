[project]
name = "microcosm-provider-core"
version = "0.1.0"
description = "Shared collector sessions and Alembic-managed local provider persistence"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["alembic>=1.13.3,<2", "sqlalchemy>=2,<3", "huggingface-hub>=0.20,<2"]

[project.urls]
Source = "https://github.com/PolicyEngine/microcosm-local-provider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microcosm_provider_core"]
