[project]
name = "policyengine-telemetry"
version = "0.1.0"
description = "Telemetry client and local telemetry emitter service module"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "policyengine-local-service==0.1.0",
    "alembic>=1.13.3,<2",
    "sqlalchemy>=2,<3",
    "huggingface-hub>=0.20,<2",
    "psutil>=6,<8",
]

[project.urls]
Source = "https://github.com/PolicyEngine/local-services"

[project.entry-points."policyengine.local_service.modules"]
telemetry = "policyengine_telemetry.service:create_module"

[tool.uv.sources]
policyengine-local-service = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policyengine_telemetry"]
