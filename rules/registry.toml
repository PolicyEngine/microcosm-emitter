workflow = ".github/workflows/pr.yaml"
job = "rules"
invocation = "unittest discover -s scripts/rules/tests"

[[rule]]
id = "emitter.process.feature-branches-and-pull-requests"
category = "process"
statement = "Push feature branches and open pull requests; never push to main directly, merge automatically or monitor queued checks."
rationale = "AGENTS.md"
scope = ["AGENTS.md"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"
