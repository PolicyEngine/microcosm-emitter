# Rules registry for microcosm-emitter.
#
# Every rule that governs this repository is declared here: what it says, how
# mechanically it is enforced, where it runs in CI, and whether a checker has
# been proven to reject a bad example. `python -m scripts.rules guard` keeps this
# file honest; `python -m scripts.rules render` regenerates
# docs/generated/rules.md and the Rules section in AGENTS.md.
#
# How to add or change a rule: docs/engineering/skills/rules-registry.md

schema_version = 1
repo = "microcosm-emitter"
# Each [rule.downgrade] names an open issue here that tracks restoring the rule.
issue_repository = "PolicyEngine/microcosm-emitter"

# Where this repository keeps what the checks read.
[repository]
rule_prefix = "emitter"
pr_workflow = ".github/workflows/pr.yaml"
script_directories = ["tools"]
test_directories = ["tests"]
# microcosm-emitter at the root, and microcosm-emitter-interface.
packages = [".", "packages/*"]
file_exception_directories = ["tests", ".github", "tools", "scripts"]

[[category]]
id = "boundaries"
title = "Runtime and package boundaries"

[[category]]
id = "persistence"
title = "Databases and migrations"

[[category]]
id = "distributions"
title = "Distributions and releases"

[[category]]
id = "protocol"
title = "Collector protocol"

[[category]]
id = "tests"
title = "Test isolation"

[[category]]
id = "quality"
title = "Code quality"

[[category]]
id = "dependencies"
title = "Dependency locking"

[[category]]
id = "ci"
title = "CI workflows and scripts"

[[category]]
id = "process"
title = "Process and repository hygiene"

[discovery]
# Every job of the pull-request workflow, of the verification workflow it
# calls and of the PR description workflow needs a rule. push.yaml stays out: its jobs run after merging, and
# tests/test_workflows.py checks their order.
workflows = [
  ".github/workflows/pr.yaml",
  ".github/workflows/ci.yml",
  ".github/workflows/pr-description.yaml",
]
# Every test in these files checks structure, configuration or a released
# contract, so each needs a rule.
guard_test_globs = [
  "tests/test_boundaries.py",
  "tests/test_workflows.py",
  "tests/test_package_names.py",
  "tests/test_source_archives.py",
  "tests/interface/test_protocol_fixtures.py",
  "tests/test_dependabot.py",
]
# Structure tests in files that otherwise test behaviour.
extra_guard_tests = [
  "tests/interface/test_client_messages.py::test_every_fixture_has_a_typed_call_that_produces_it",
  "tests/interface/test_host_protocol.py::test_every_host_fixture_has_a_test_that_sends_it",
  "tests/interface/test_in_process_clients.py::test_every_telemetry_message_fixture_has_an_in_process_call",
  "tests/interface/test_in_process_clients.py::test_in_process_clients_reuse_the_interface_definitions",
  "tests/orrery/test_client.py::test_graph_adapter_never_imports_persistence_or_auth",
  "tests/test_collector_origin.py::test_every_trusted_origin_is_a_bare_https_origin",
]

[agents]
instructions = "AGENTS.md"
adapters = ["CLAUDE.md"]

# What the ci-scripts guard reads: every workflow, the tests that may name a
# script, and each check's tolerated violations. All three lists are empty.
[ci_scripts]
workflows = [".github/workflows/*.yml", ".github/workflows/*.yaml"]
test_globs = ["tests/**/test_*.py"]
multiline_baseline = "rules/baselines/ci-multiline-run.txt"
untested_baseline = "rules/baselines/ci-untested-scripts.txt"
shellcheck_baseline = "rules/baselines/ci-shellcheck.txt"

# --- Runtime and package boundaries ------------------------------------------

[[rule]]
id = "emitter.boundaries.host-imports-no-domain-code"
category = "boundaries"
statement = "The generic runtime, microcosm_emitter.host, imports no telemetry, Orrery, database or authentication code, no Microcosm, SQLAlchemy, Alembic or Hugging Face Hub module, and not the interface package."
rationale = "README.md"
scope = ["src/microcosm_emitter/host/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/test_boundaries.py::test_generic_runtime_has_no_domain_or_database_imports",
  "tests/test_boundaries.py::test_emitter_host_does_not_import_the_interface",
]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

[[rule]]
id = "emitter.boundaries.telemetry-client-imports-no-service-code"
category = "boundaries"
statement = "The telemetry client, microcosm_emitter.telemetry outside its service package, imports no service implementation, database or authentication module, and importing the public modules opens no socket, starts no process and creates no directory."
rationale = "README.md"
scope = ["src/microcosm_emitter/telemetry/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/test_boundaries.py::test_client_has_no_service_or_database_imports",
  "tests/test_boundaries.py::test_public_imports_have_no_runtime_side_effects",
]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

[[rule]]
id = "emitter.boundaries.graph-adapter-imports-no-service-code"
category = "boundaries"
statement = "Graph adapters, the Orrery client and its contracts, import no service, database, authentication or HTTP code: inventory hashing, durable enqueue, receipt lookup and retries run in the separate local emitter service, and the client never falls back to writing the database directly."
rationale = "README.md"
scope = ["src/microcosm_emitter/orrery/client.py", "src/microcosm_emitter/orrery/contracts.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/test_boundaries.py::test_graph_client_has_no_service_database_auth_or_http_imports",
  "tests/orrery/test_client.py::test_graph_adapter_never_imports_persistence_or_auth",
]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

[[rule]]
id = "emitter.boundaries.interface-imports-only-the-standard-library"
category = "boundaries"
statement = "The interface package imports only the standard library and itself, and importing it loads no microcosm_emitter module."
rationale = "packages/microcosm-emitter-interface/README.md"
scope = ["packages/microcosm-emitter-interface/src/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/test_boundaries.py::test_interface_imports_only_the_standard_library_and_itself",
  "tests/test_boundaries.py::test_interface_imports_have_no_runtime_side_effects",
]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

[[rule]]
id = "emitter.boundaries.shared-definitions-written-once"
category = "boundaries"
statement = "What both packages use is defined once: the emitter's in-process clients reuse the interface's TelemetryRun, wire_value, Orrery publication types and default_spool_path rather than copies, and each hand-over failure code and limit the packages share is assigned at module level exactly once across both."
rationale = "packages/microcosm-emitter-interface/README.md"
scope = ["src/microcosm_emitter/**/*.py", "packages/microcosm-emitter-interface/src/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/interface/test_in_process_clients.py::test_in_process_clients_reuse_the_interface_definitions",
  "tests/test_boundaries.py::test_hand_over_codes_and_limits_are_defined_once",
]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

[[rule]]
id = "emitter.boundaries.public-credential-lookup"
category = "boundaries"
statement = "Code reads the Hugging Face credential through core.auth.huggingface_token; no module imports the private _huggingface_token."
rationale = "README.md#delivery-and-persistence"
scope = ["src/microcosm_emitter/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/test_boundaries.py::test_the_credential_lookup_is_public",
  "tests/test_boundaries.py::test_no_module_imports_the_private_credential_lookup",
]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

# --- Databases and migrations --------------------------------------------------

[[rule]]
id = "emitter.persistence.no-raw-sql-or-schema-calls"
category = "persistence"
statement = "No module under src/microcosm_emitter calls a function or method named create_all, exec_driver_sql, executescript or text, or imports sqlite3, psycopg or psycopg2 in the form import <module>."
rationale = "README.md#delivery-and-persistence"
scope = ["src/microcosm_emitter/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = ["tests/test_boundaries.py::test_database_code_has_no_raw_sql_or_manual_schema_creation"]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

# The test above checks only the calls and imports it names: a direct-driver
# import written as from sqlite3 import ..., schema repair and adopting an
# older database are not checked.
[[rule]]
id = "emitter.persistence.sqlalchemy-and-alembic-only"
category = "persistence"
statement = "Python databases use the SQLAlchemy declarative ORM and Alembic only: no handwritten SQL or direct-driver persistence in any form, no schema repair and no adoption of databases made before Alembic."
rationale = "README.md#delivery-and-persistence"
scope = ["src/microcosm_emitter/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

# The repository has no TypeScript, so the scope is the file that states the
# rule until there is some.
[[rule]]
id = "emitter.persistence.typescript-uses-drizzle"
category = "persistence"
statement = "TypeScript database code, if any is added, uses Drizzle ORM and Drizzle Kit migrations."
rationale = "AGENTS.md"
scope = ["AGENTS.md"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

# --- Distributions and releases ------------------------------------------------

[[rule]]
id = "emitter.distributions.exactly-two-at-one-version"
category = "distributions"
statement = "The repository publishes exactly two distributions, always together and at one version: microcosm-emitter, which installs the generic host and its required telemetry with no extras, and the dependency-free microcosm-emitter-interface, which microcosm-emitter==X requires at ==X; there are no standalone telemetry packages, optional telemetry installs or further distributions."
rationale = "README.md"
scope = ["pyproject.toml", "packages/*/pyproject.toml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/test_package_names.py::test_emitter_requires_telemetry_and_its_own_interface_release",
  "tests/test_package_names.py::test_interface_is_the_only_other_distribution_and_has_no_dependencies",
  "tests/test_package_names.py::test_installed_distribution_includes_host_telemetry_and_migrations",
  "tests/test_package_names.py::test_installed_distribution_provides_the_emitter_command",
]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

[[rule]]
id = "emitter.distributions.version-from-fragments"
category = "distributions"
statement = "A release's version bump follows its changelog fragment types (breaking is a major bump, added or removed a minor bump, anything else a patch bump) and rewrites both distributions' versions and the interface pin together, and the release refuses diverged versions, a different pin, missing or untyped fragments, and a missing or repeated version line."
rationale = "README.md#publication"
scope = ["tools/bump-version.py", "pyproject.toml", "packages/microcosm-emitter-interface/pyproject.toml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/test_workflows.py::test_fragment_types_choose_the_bump",
  "tests/test_workflows.py::test_release_rewrites_both_versions_and_the_interface_pin_only",
  "tests/test_workflows.py::test_release_refuses_diverged_distribution_versions",
  "tests/test_workflows.py::test_release_refuses_an_interface_pin_that_differs_from_the_version",
  "tests/test_workflows.py::test_release_refuses_missing_or_untyped_fragments",
  "tests/test_workflows.py::test_release_refuses_a_missing_or_duplicated_version_line",
]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

# tools/check-artifacts.sh runs these checks, so discovery cannot see them.
[[rule]]
id = "emitter.distributions.artifacts-verified"
category = "distributions"
statement = "Every pull request builds both distributions, each wheel from its source archive, and checks them: twine check --strict passes; tools/check-installed.py finds one wheel and one source archive per distribution, refuses a source archive holding the rules tool, and installs the wheels into two clean environments outside the checkout without Hugging Face credentials; in the emitter's, Microcosm is absent, the project URL is the repository, importing the host and the Orrery client loads no database, Hugging Face, telemetry or service module, and telemetry-only, graph-only, combined and failing services start and record their events and graph jobs in an event queue database at Alembic revision 20261008_02; in a build's, which holds only the interface, the interface has no requirements and ships its protocol fixtures, and the installed emitter it starts reports the interface's version and the telemetry, Orrery and Hugging Face modules, accepts telemetry, an Orrery hand-over and a run-file staging request, and exits with status 0."
rationale = "README.md#publication"
scope = ["tools/check-artifacts.sh", "tools/check-installed.py", "tools/installed-smoke.py", "tools/installed-interface-smoke.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "build-packages"
invocation = "tools/check-artifacts.sh"
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = "tools/check-artifacts.sh"

[[rule]]
id = "emitter.distributions.one-build-script"
category = "distributions"
statement = "Only tools/check-artifacts.sh builds the distributions, with one uv build --all-packages into a dist directory it removes beforehand and no --clear, no workflow runs uv build itself, and tools/check-installed.py checks the interface wheel apart from the emitter."
rationale = "README.md#publication"
scope = ["tools/check-artifacts.sh", "tools/check-installed.py", ".github/workflows/*.yml", ".github/workflows/*.yaml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/test_workflows.py::test_build_verifies_both_distributions_from_one_script",
  "tests/test_workflows.py::test_installed_check_keeps_the_interface_apart_from_the_emitter",
]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

[[rule]]
id = "emitter.distributions.source-archives-exclude-the-rules-tool"
category = "distributions"
statement = "The microcosm-emitter source archive leaves out the rules tool, the registry and their documents, and tools/check-installed.py refuses either source archive if it holds any of them, naming the same paths the build excludes."
rationale = "docs/engineering/skills/rules-registry.md"
scope = ["pyproject.toml", "tools/check-installed.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/test_source_archives.py::test_the_emitter_build_excludes_what_the_artifact_check_refuses",
  "tests/test_source_archives.py::test_the_artifact_check_refuses_an_archive_holding_the_rules_tool",
  "tests/test_source_archives.py::test_the_artifact_check_accepts_an_archive_without_it",
]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

[[rule]]
id = "emitter.distributions.release-order"
category = "distributions"
statement = "push.yaml releases a merge to main in order (the version commit, then ci.yml on that commit, then the tag, then publication) and publishes to PyPI only the artifacts ci.yml built, one per distribution, the interface first, skipping files PyPI already holds so a rerun completes a partial upload."
rationale = "README.md#publication"
scope = [".github/workflows/push.yaml", ".github/workflows/ci.yml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/test_workflows.py::test_release_commit_is_verified_then_tagged_then_published",
  "tests/test_workflows.py::test_verification_uploads_each_distribution_as_its_own_artifact",
  "tests/test_workflows.py::test_emitter_artifact_pattern_excludes_the_interface",
  "tests/test_workflows.py::test_pypi_receives_only_verified_artifacts",
  "tests/test_workflows.py::test_publication_uploads_the_interface_first_and_can_be_rerun",
]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

[[rule]]
id = "emitter.distributions.release-credentials"
category = "distributions"
statement = "In push.yaml only the publish job, in the pypi environment, may request an OpenID Connect token, and the workflow reads no secrets but APP_ID and APP_PRIVATE_KEY, once each, for the GitHub App token that commits the version."
rationale = "README.md#publication"
scope = [".github/workflows/push.yaml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = ["tests/test_workflows.py::test_only_publication_holds_oidc_and_only_versioning_holds_secrets"]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

# --- Collector protocol --------------------------------------------------------

# tools/check-collector.sh runs these tests against the installed wheels, so
# the tests job, which deselects the collector marker, does not.
[[rule]]
id = "emitter.protocol.collector-contract"
category = "protocol"
statement = "The installed wheels deliver telemetry to the collector at the commit tools/check-collector.sh pins, with a disposable PostgreSQL database: events become dashboard documents, rejected identities register nothing, a lost acknowledgement is retried without duplicates, and blocked outcomes and supplied failure codes survive."
rationale = "README.md#development"
scope = ["tools/check-collector.sh", "src/microcosm_emitter/telemetry/service/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/test_collector_contract.py::test_service_events_materialize_as_dashboard_documents",
  "tests/test_collector_contract.py::test_rejected_identity_never_registers_or_uploads_run",
  "tests/test_collector_contract.py::test_lost_ack_retries_same_event_after_restart_without_duplicates",
  "tests/test_collector_contract.py::test_blocked_run_projects_check_metadata_without_failure",
  "tests/test_collector_contract.py::test_supplied_failure_codes_survive_collector_storage_and_documents",
]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "collector"
invocation = "tools/check-collector.sh"

[[rule]]
id = "emitter.protocol.no-hosted-events-api"
category = "protocol"
statement = "Preserve the existing collector protocol, and do not add a general hosted events API."
rationale = "README.md#delivery-and-persistence"
scope = ["src/microcosm_emitter/telemetry/service/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "emitter.protocol.released-fixtures-unchanged"
category = "protocol"
statement = "A released protocol fixture is never edited or removed, since each one's SHA-256 is pinned, and every fixture's protocol version is one this emitter accepts."
rationale = "packages/microcosm-emitter-interface/README.md#compatibility"
scope = ["packages/microcosm-emitter-interface/src/microcosm_emitter_interface/fixtures/protocol-v1/*.json"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/interface/test_protocol_fixtures.py::test_released_fixtures_are_unchanged",
  "tests/interface/test_protocol_fixtures.py::test_every_fixture_uses_a_protocol_version_this_emitter_accepts",
]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

[[rule]]
id = "emitter.protocol.every-fixture-sent-and-answered"
category = "protocol"
statement = "Every protocol fixture has an interface test that produces it, from a typed call, a module configuration or a host request, and this emitter answers each one: the telemetry, Orrery and Hugging Face modules handle their message and query fixtures, the installed command starts from the launch fixture and answers hello with at least the recorded keys, and the host routes each envelope fixture to its module."
rationale = "packages/microcosm-emitter-interface/README.md#compatibility"
scope = ["packages/microcosm-emitter-interface/src/microcosm_emitter_interface/fixtures/protocol-v1/*.json"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/interface/test_client_messages.py::test_every_fixture_has_a_typed_call_that_produces_it",
  "tests/interface/test_host_protocol.py::test_every_host_fixture_has_a_test_that_sends_it",
  "tests/interface/test_in_process_clients.py::test_every_telemetry_message_fixture_has_an_in_process_call",
  "tests/interface/test_protocol_fixtures.py::test_telemetry_module_records_each_message_fixture",
  "tests/interface/test_protocol_fixtures.py::test_orrery_module_answers_each_query_fixture_in_order",
  "tests/interface/test_protocol_fixtures.py::test_hugging_face_module_answers_each_query_fixture_in_order",
  "tests/interface/test_protocol_fixtures.py::test_installed_command_answers_the_hello_fixture",
  "tests/interface/test_protocol_fixtures.py::test_installed_command_starts_from_the_launch_fixture",
  "tests/interface/test_protocol_fixtures.py::test_host_answers_each_envelope_fixture",
]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

[[rule]]
id = "emitter.protocol.trusted-collector-origins"
category = "protocol"
statement = "Every trusted collector origin is a bare HTTPS origin that a module configuration selects as itself, with or without a trailing slash."
rationale = "README.md#delivery-and-persistence"
scope = ["src/microcosm_emitter/core/constants.py", "src/microcosm_emitter/core/collector_origin.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = ["tests/test_collector_origin.py::test_every_trusted_origin_is_a_bare_https_origin"]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

# --- Test isolation ------------------------------------------------------------

# conftest.py's autouse fixture applies to every test the tests job runs.
[[rule]]
id = "emitter.tests.no-ambient-credentials-or-hosted-collector"
category = "tests"
statement = "Tests never use ambient Hugging Face credentials, and never send a telemetry or authentication request to a hosted collector: an autouse fixture in conftest.py removes the Hugging Face credential variables, gives each test a temporary Hugging Face home, and fails a test whose telemetry or authentication request names a host other than loopback."
rationale = "README.md#development"
scope = ["conftest.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

[[rule]]
id = "emitter.tests.real-migrations-synthetic-credentials"
category = "tests"
statement = "Tests use temporary databases created through real migrations, synthetic credentials and loopback network services, and contact no hosted collector through any client, including the HTTP clients of the submissions client and the Orrery queue, which conftest.py does not intercept."
rationale = "README.md#development"
scope = ["tests/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

# --- Code quality --------------------------------------------------------------

# The guard requires a rule for every rule family ruff selects.
[[rule]]
id = "emitter.quality.ruff-lint"
category = "quality"
statement = "All Python passes ruff check with the rule families E, F, I, N, W, UP and B selected, except E501 (line length), which ruff format settles."
rationale = "AGENTS.md"
scope = ["**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = true
[rule.enforcer]
kind = "ruff"
mode = "lint"
codes = ["B", "E", "F", "I", "N", "UP", "W"]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "quality"
invocation = "tools/check-quality.sh"

# tools/check-quality.sh runs ruff format --check, so discovery cannot see it.
[[rule]]
id = "emitter.quality.ruff-format"
category = "quality"
statement = "All Python is formatted with ruff format."
rationale = "README.md#development"
scope = ["**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = true
[rule.enforcer]
kind = "ruff"
mode = "format"
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "quality"
invocation = "tools/check-quality.sh"

[[rule]]
id = "emitter.quality.tests-pass"
category = "quality"
statement = "Every pytest test under tests/ except the collector contract test passes in ci.yml's tests job, on Ubuntu and macOS with Python 3.13 and 3.14, in the environment uv sync --locked installs."
rationale = "README.md#development"
scope = ["tests/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

# Test code is what [repository].test_directories lists, as paths from the
# root, plus the rules tool's own tests and fixtures.
[[rule]]
id = "emitter.quality.python-file-length"
category = "quality"
statement = "No tracked Python file has more than 800 lines, or more than 1,500 if it is test code: a file under tests/ or under the rules tool's tests and fixtures, scripts/rules/tests/."
rationale = "README.md#development"
scope = ["**/*.py"]
tier = "metric"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "file-length"
[[rule.ci]]
workflow = ".github/workflows/pr.yaml"
job = "rules"
invocation = "run_quality_guards.py"
[rule.proof]
# Files at their limit (below) pass, and files one line over it (above) fail.
below_fixture = "scripts/rules/tests/fixtures/file_length/good_files.toml"
above_fixture = "scripts/rules/tests/fixtures/file_length/bad_files.toml"
# The source limit; both fixtures also cover the 1,500-line limit for test code.
threshold = 800
test = "scripts/rules/tests/test_file_length.py::TestFileLengthProof::test_rule_proof_python_file_length"
workflow = ".github/workflows/pr.yaml"
job = "rules"
invocation = "unittest discover -s scripts/rules/tests"

[[rule]]
id = "emitter.quality.rules-tool-tests-pass"
category = "quality"
statement = "The rules tool's own tests, the unittest tests under scripts/rules/tests, pass in pr.yaml's rules job, on Ubuntu with Python 3.13 and only the standard library."
rationale = "docs/engineering/skills/rules-registry.md#commands"
scope = ["scripts/rules/tests/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
[[rule.ci]]
workflow = ".github/workflows/pr.yaml"
job = "rules"
invocation = "unittest discover -s scripts/rules/tests"

[[rule]]
id = "emitter.quality.toolchain"
category = "quality"
statement = "Use uv, Python 3.13 or later, pytest and Ruff."
rationale = "README.md#development"
scope = ["pyproject.toml", "uv.lock"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

# --- Dependency locking --------------------------------------------------------

# The locked-installs guard names these four rules by their ids.
[[rule]]
id = "emitter.dependencies.lock-committed"
category = "dependencies"
statement = "Every project directory with a pyproject.toml commits a uv.lock that matches it, or is a member of the uv workspace whose uv.lock locks it, and a pull-request job checks the lock with uv lock --check."
rationale = "scripts/rules/locked_installs.py"
scope = ["pyproject.toml", "uv.lock", "packages/*/pyproject.toml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "locked-installs"
[[rule.ci]]
workflow = ".github/workflows/pr.yaml"
job = "rules"
invocation = "run_quality_guards.py"
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "quality"
invocation = "uv lock --check"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/locked_installs/lock_bad"
good_fixture = "scripts/rules/tests/fixtures/locked_installs/lock_good"
test = "scripts/rules/tests/test_locked_installs.py::TestLockedInstallsProof::test_rule_proof_lock_committed"
workflow = ".github/workflows/pr.yaml"
job = "rules"
invocation = "unittest discover -s scripts/rules/tests"

[[rule]]
id = "emitter.dependencies.install-from-lock"
category = "dependencies"
statement = "Every install of the project's Python dependencies, in workflows, the shell scripts under tools/ they run and the commands the Python scripts under tools/ start, installs exactly the locked versions (uv sync --locked, uv run --locked); any other install is a registered exception for that one site."
rationale = "scripts/rules/locked_installs.py"
scope = [".github/workflows/*.yml", ".github/workflows/*.yaml", "tools/*.sh", "tools/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "locked-installs"
[[rule.ci]]
workflow = ".github/workflows/pr.yaml"
job = "rules"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/locked_installs/install_bad"
good_fixture = "scripts/rules/tests/fixtures/locked_installs/install_good"
test = "scripts/rules/tests/test_locked_installs.py::TestLockedInstallsProof::test_rule_proof_install_from_lock"
workflow = ".github/workflows/pr.yaml"
job = "rules"
invocation = "unittest discover -s scripts/rules/tests"

[[rule.exception]]
path = ".github/workflows/pr.yaml"
match = "uv tool install shellcheck-py==0.11.0.1"
category = "pinned-tool"
reason = "shellcheck is a binary the ci-scripts tests run; the rules job has no project environment, so it installs the exact shellcheck-py release."

[[rule.exception]]
path = ".github/workflows/pr.yaml"
match = "uv run --no-project python -m unittest discover -s scripts/rules/tests"
reason = "The rules tool uses only the standard library, so its tests run without installing the project."
removal = "scripts/rules needs a package beyond the standard library"

[[rule.exception]]
path = ".github/workflows/pr.yaml"
match = "uv run --no-project python scripts/run_quality_guards.py"
reason = "The quality guards are the rules tool, which uses only the standard library, so they run without installing the project."
removal = "scripts/rules needs a package beyond the standard library"

[[rule.exception]]
path = ".github/workflows/pr-description.yaml"
match = "uv run --no-project python -m scripts.rules.pr_description"
reason = "The PR description check is part of the rules tool, which uses only the standard library, so it runs without installing the project."
removal = "scripts/rules needs a package beyond the standard library"

[[rule.exception]]
path = "tools/check-changelog.sh"
match = "uv run --no-project python tools/bump-version.py --check"
reason = "tools/bump-version.py uses only the standard library, so the changelog job checks fragments without installing the project."
removal = "tools/bump-version.py needs a package beyond the standard library"

[[rule.exception]]
path = "tools/update-version.sh"
match = "uv run --no-project python tools/bump-version.py"
reason = "tools/bump-version.py uses only the standard library, so the release bumps the version before uv lock records it, without installing the project."
removal = "tools/bump-version.py needs a package beyond the standard library"

[[rule.exception]]
path = "tools/update-version.sh"
match = "uvx --from towncrier==26.9.0"
category = "pinned-tool"
reason = "towncrier builds the changelog at release time and is no dependency of either distribution, so the release runs the exact towncrier release."

[[rule.exception]]
path = "tools/check-installed.py"
match = "uv pip install --python"
reason = "The installed-artifact check installs the built wheels into two clean environments as uv tool install microcosm-emitter does for a user, so it resolves their runtime dependencies from PyPI afresh: it tests what a user installing this release gets today, not the locked versions."
removal = "the check no longer reproduces a user's install"

[[rule.exception]]
path = "tools/check-collector.sh"
match = "uv pip install -e .collector/telemetry-service"
reason = "The collector contract test runs against calibration-diagnostics' telemetry-service at the commit the script pins, which is no part of this workspace or its uv.lock."
removal = "the contract test no longer installs the pinned collector from its source"

[[rule.exception]]
path = "tools/check-collector.sh"
match = "uv pip install --reinstall --no-deps dist/*.whl"
reason = "The contract test tests the wheels build-packages built, so they replace the workspace's editable installs; their dependencies come from the locked environment uv sync --locked installed first."
removal = "the contract test no longer tests the built wheels"

[[rule.exception]]
path = "tools/check-collector.sh"
match = "uv run --no-sync pytest tests/test_collector_contract.py"
reason = "Syncing would replace the installed wheels with the workspace sources, so the contract test runs in the locked environment without syncing it again."
removal = "the contract test no longer tests the built wheels"

[[rule]]
id = "emitter.dependencies.test-from-lock"
category = "dependencies"
statement = "Every test command (pytest, python -m unittest) in workflows, the shell scripts under tools/ they run and the commands the Python scripts under tools/ start runs through uv run --locked, in the locked environment; any other test run is a registered exception for that one site."
rationale = "scripts/rules/locked_installs.py"
scope = [".github/workflows/*.yml", ".github/workflows/*.yaml", "tools/*.sh", "tools/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "locked-installs"
[[rule.ci]]
workflow = ".github/workflows/pr.yaml"
job = "rules"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/locked_installs/test_bad"
good_fixture = "scripts/rules/tests/fixtures/locked_installs/test_good"
test = "scripts/rules/tests/test_locked_installs.py::TestLockedInstallsProof::test_rule_proof_test_from_lock"
workflow = ".github/workflows/pr.yaml"
job = "rules"
invocation = "unittest discover -s scripts/rules/tests"

[[rule.exception]]
path = ".github/workflows/pr.yaml"
match = "python -m unittest discover -s scripts/rules/tests"
reason = "The rules tool uses only the standard library and is no part of either distribution, so its tests run without the project's locked environment."
removal = "scripts/rules needs a package beyond the standard library"

[[rule.exception]]
path = "tools/check-collector.sh"
match = "uv run --no-sync pytest tests/test_collector_contract.py"
reason = "Syncing would replace the installed wheels with the workspace sources, so the contract test runs in the locked environment without syncing it again."
removal = "the contract test no longer tests the built wheels"

[[rule]]
id = "emitter.dependencies.dependabot-relock"
category = "dependencies"
statement = "Dependabot proposes uv.lock updates every week, for the uv ecosystem at the repository root, as one grouped pull request that changes only uv.lock (versioning-strategy lockfile-only); it runs on GitHub's side with its own credentials, so no secret of this repository reaches the code resolving runs."
rationale = ".github/dependabot.yml"
scope = [".github/dependabot.yml", "uv.lock"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = ["tests/test_dependabot.py::test_dependabot_proposes_uv_lock_updates_weekly"]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

[[rule]]
id = "emitter.distributions.lock-only-merges-release-nothing"
category = "distributions"
statement = "A Dependabot pull request that changes only uv.lock needs no changelog fragment, since it changes no published package's requirements, and a merge without fragments releases nothing: tools/update-version.sh changes no file and push.yaml makes no version commit, so nothing is tagged or published."
rationale = "README.md#publication"
scope = ["tools/check-changelog.sh", "tools/update-version.sh", ".github/workflows/pr.yaml", ".github/workflows/push.yaml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/test_dependabot.py::test_a_dependabot_lock_update_needs_no_fragment",
  "tests/test_dependabot.py::test_other_pull_requests_need_a_fragment",
  "tests/test_dependabot.py::test_the_changelog_job_tells_the_script_who_opened_the_pull_request",
  "tests/test_dependabot.py::test_a_merge_without_a_fragment_releases_nothing",
  "tests/test_dependabot.py::test_a_merge_with_a_fragment_is_released",
  "tests/test_dependabot.py::test_versioning_commits_only_a_release",
]
[[rule.ci]]
workflow = ".github/workflows/ci.yml"
job = "tests"
invocation = 'pytest -m "not collector"'

[[rule]]
id = "emitter.dependencies.uv-version-pinned"
category = "dependencies"
statement = "The one uv release is written once, as the line uv==X.Y.Z in .github/uv-version.txt: each astral-sh/setup-uv step reads it with version-file and writes no version:, any uv container image, install script, release download or package install of uv names it, and the root pyproject.toml's [tool.uv] required-version is a lower bound (>=X.Y) it meets, so an older uv refuses the project while Dependabot's uv still runs."
rationale = "scripts/rules/uv_version.py"
scope = [".github/uv-version.txt", "pyproject.toml", ".github/workflows/*.yml", ".github/workflows/*.yaml", "tools/*.sh"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "uv-version"
[[rule.ci]]
workflow = ".github/workflows/pr.yaml"
job = "rules"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/uv_version/bad"
good_fixture = "scripts/rules/tests/fixtures/uv_version/good"
test = "scripts/rules/tests/test_uv_version.py::TestUvVersionProof::test_rule_proof_uv_version_pinned"
workflow = ".github/workflows/pr.yaml"
job = "rules"
invocation = "unittest discover -s scripts/rules/tests"

